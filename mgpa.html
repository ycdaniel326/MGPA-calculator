<!DOCTYPE html>
<html>
<head>
    <title>MGPA Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>MGPA Calculator</h1>

    <div class="main-container">

        <!-- CENTER COLUMN -->
        <div class="center-panel">

            <div class="record-card">
                <h2>Current MGPA Record</h2>

                <div class="record-row">

                    <div>
                        <p>Credits Studied</p>
                        <strong id="displayCredits">0</strong>
                    </div>

                    <div>
                        <p>Current MGPA</p>
                        <strong id="displayMgpa">0.000</strong>
                    </div>

                </div>

                <button onclick="toggleEditRecord()">
                    Edit Current Record
                </button>
            </div>

            <div id="editRecordBox" class="box hidden">

                <h2>Edit Current Record</h2>

                <p>Current Credits:</p>
                <input id="currentCredits" type="number">

                <p>Current MGPA:</p>
                <input id="currentMgpa" type="number" step="0.001">

                <button onclick="saveRecord()">
                    Save Record
                </button>

            </div>

            <div class="box">

                <h2>Add actual / predicted grade</h2>

                <p>Course Credits:</p>

                <select id="courseCredits">
                    <option value="1">1 Credit</option>
                    <option value="2">2 Credits</option>
                    <option value="3" selected>3 Credits</option>
                    <option value="4">4 Credits</option>
                </select>

                <p>Grade:</p>

                <select id="grade">
                    <option value="4.3">A+ (4.3)</option>
                    <option value="4.0">A (4.0)</option>
                    <option value="3.7">A- (3.7)</option>
                    <option value="3.3">B+ (3.3)</option>
                    <option value="3.0">B (3.0)</option>
                    <option value="2.7">B- (2.7)</option>
                    <option value="2.3">C+ (2.3)</option>
                    <option value="2.0">C (2.0)</option>
                    <option value="1.7">C- (1.7)</option>
                    <option value="1.0">D (1.0)</option>
                    <option value="0">F (0.0)</option>
                </select>
                <button onclick="addGrade()">
                    Add Actual Grade
                </button>

                <button onclick="testGrade()">
                    Test Predicted MGPA
                </button>



            </div>

        </div>

        <!-- RIGHT COLUMN -->
        <div class="right-panel">

            <div class="box result-box">

                <h2>Result</h2>

                <p id="result">
                    No result yet.
                </p>

            </div>

            <div class="box history-box">
                <h2>History - Actual Grade Added</h2>
                <ul id="historyList">
                </ul>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
